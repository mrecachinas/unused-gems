[package]
name = "unused-gems"
version = "0.1.0"
edition = "2021"
description = "High-performance scanner for unused gems in Ruby projects"

[dependencies]
ruby-prism = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
regex = "1"
ignore = { version = "0.4", default-features = false }
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
once_cell = "1"
memchr = "2"
bincode = "1"
tar = "0.4"
flate2 = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = true
